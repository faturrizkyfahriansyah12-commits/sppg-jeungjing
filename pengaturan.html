<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pengaturan Akun — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="page-shell">
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob--sky-top"></div>
    <div class="blob blob--gold-left"></div>
    <div class="blob blob--sky-bottom"></div>
    <div class="dots"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="assets/logo.png" alt="Logo SPPG Jeungjing" class="header-logo">
        <div class="header-text">
          <h1>SPPG JEUNGJING</h1>
          <p>Portal Relawan</p>
        </div>
      </div>
      <img src="assets/logo-bgn.png" alt="Logo Badan Gizi Nasional" class="header-logo header-logo--bgn">
    </div>
  </header>

  <div class="page-subheader">
    <a href="profil.html" class="page-subheader-back">← Kembali</a>
    <h2 class="page-subheader-title">Pengaturan Akun</h2>
  </div>

  <main class="auth-main" id="pengaturanMain" style="display:none;">

    <section class="auth-card">
      <div class="profile-identity-list">
        <div class="profile-identity-row"><span>Status Akun</span><span id="statusAkun">—</span></div>
        <div class="profile-identity-row"><span>Login Terakhir</span><span id="loginTerakhir">—</span></div>
      </div>
    </section>

    <p class="settings-section-title">Keamanan &amp; Preferensi</p>
    <nav class="settings-menu-list" aria-label="Menu Pengaturan Akun">
      <a href="ganti-password.html" class="settings-menu-item">
        <span class="settings-menu-item-icon">🔐</span>
        <span class="settings-menu-item-text">
          <p class="settings-menu-item-title">Ganti Password</p>
          <p class="settings-menu-item-desc">Ubah password akun Anda</p>
        </span>
        <span class="settings-menu-item-arrow">→</span>
      </a>
    </nav>

    <section class="auth-card">
      <button type="button" id="btnKeluar" class="btn-danger-outline">Keluar</button>
    </section>
  </main>

  <div class="toast is-hidden" id="errorToast" role="alert"></div>

  <div class="loading-overlay is-hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText">Memuat pengaturan...</p>
  </div>

  <footer class="site-footer">
    <p><strong>SPPG JEUNGJING</strong> · Portal Relawan</p>
    <p class="credit">© 2026 SPPG Jeungjing · Developed by Fatur Rizky Fahriansyah</p>
  </footer>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth-relawan.js"></script>
<script src="pengaturan.js"></script>
</body>
</html>
