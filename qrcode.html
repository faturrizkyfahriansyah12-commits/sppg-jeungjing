<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Absensi — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="qr-page">
  <div class="qr-card">
    <img src="assets/logo.png" alt="Logo SPPG Jeungjing" class="qr-logo">
    <h1>SPPG JEUNGJING</h1>
    <p class="qr-subtitle">Sistem Absensi Relawan</p>
    <div id="qrcodeContainer" class="qr-box"></div>
    <p class="qr-instruction">Scan QR Code untuk melakukan absensi.</p>
    <button class="btn-secondary no-print" onclick="window.print()">Cetak QR Code</button>
    <p class="no-print" style="font-size:11.5px;color:var(--color-text-muted);margin-top:14px;">
      Halaman ini untuk admin — cetak dan tempel di lokasi absensi.<br>
      <a href="index.html" class="admin-link" style="margin-top:6px;">← Kembali ke halaman absensi</a>
    </p>
  </div>

  <script>
    // URL tujuan dibuat otomatis mengikuti alamat website ini saat ini,
    // sehingga tidak perlu diisi manual — cukup buka halaman ini setelah
    // website berhasil di-deploy ke GitHub Pages.
    var targetUrl = window.location.origin + window.location.pathname.replace('qrcode.html', 'index.html');

    new QRCode(document.getElementById('qrcodeContainer'), {
      text: targetUrl,
      width: 240,
      height: 240,
      colorDark: '#15325B',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
