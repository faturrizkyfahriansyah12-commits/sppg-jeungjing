<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ganti Password — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="page-shell">
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob--sky-top"></div>
    <div class="blob blob--gold-left"></div>
    <div class="blob blob--sky-bottom"></div>
    <div class="dots"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <img src="assets/logo.png" alt="Logo SPPG Jeungjing" class="header-logo">
        <div class="header-text">
          <h1>SPPG JEUNGJING</h1>
          <p>Portal Relawan</p>
        </div>
      </div>
      <img src="assets/logo-bgn.png" alt="Logo Badan Gizi Nasional" class="header-logo header-logo--bgn">
    </div>
  </header>

  <div class="page-subheader">
    <a href="pengaturan.html" class="page-subheader-back">← Kembali</a>
    <h2 class="page-subheader-title">Ganti Password</h2>
  </div>

  <main class="auth-main">
    <section class="auth-card">
      <p class="auth-sub" style="margin-bottom:16px;">Masukkan password saat ini, lalu buat password baru.</p>
      <form id="passwordForm" novalidate>
        <div class="form-card">
          <label for="inputPasswordLama" class="form-label">Password Saat Ini</label>
          <div class="password-field">
            <input type="password" id="inputPasswordLama" class="form-input" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="togglePwLama">TAMPILKAN</button>
          </div>
        </div>
        <div class="form-card">
          <label for="inputPasswordBaru2" class="form-label">Password Baru</label>
          <div class="password-field">
            <input type="password" id="inputPasswordBaru2" class="form-input" autocomplete="new-password" minlength="6" required>
            <button type="button" class="password-toggle" id="togglePwBaru">TAMPILKAN</button>
          </div>
        </div>
        <button type="submit" id="btnGantiPassword" class="btn-submit">Ganti Password</button>
      </form>
    </section>
  </main>

  <div class="toast is-hidden" id="errorToast" role="alert"></div>

  <div class="loading-overlay is-hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText">Menyimpan...</p>
  </div>

  <footer class="site-footer">
    <p><strong>SPPG JEUNGJING</strong> · Portal Relawan</p>
    <p class="credit">© 2026 SPPG Jeungjing · Developed by Fatur Rizky Fahriansyah</p>
  </footer>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth-relawan.js"></script>
<script src="ganti-password.js"></script>
</body>
</html>
